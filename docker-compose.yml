services:
  rvc-api:
    build: .
    image: vietnamese-rvc-api:latest
    container_name: vietnamese-rvc-api
    # Tăng /dev/shm (mặc định Docker chỉ 64MB) — DataLoader nhiều tiến trình khi train cần nhiều
    shm_size: "8gb"
    ports:
      - "8000:8000"
    volumes:
      # Giữ model, âm thanh, dataset ở host để không mất khi rebuild container
      - ./assets:/app/assets
      - ./audios:/app/audios
      - ./dataset:/app/dataset
      - ./main/configs:/app/main/configs
    environment:
      # Chỉ dùng GPU 0 = RTX 5070 Ti (GPU 1 = 5060 Ti đang chạy ollama)
      - NVIDIA_VISIBLE_DEVICES=0
      - CUDA_VISIBLE_DEVICES=0
      - PYTHONUNBUFFERED=1
      # Giảm phân mảnh VRAM (khuyến nghị của PyTorch khi gặp OOM do fragmentation)
      - PYTORCH_CUDA_ALLOC_CONF=expandable_segments:True
      # API key đọc từ file .env trên host (không commit). Trống = API mở.
      - API_KEY=${API_KEY:-}
      # DB Postgres để đăng ký model theo khách hàng (đọc từ .env; trống = chỉ dùng filesystem)
      - DB_HOST=${DB_HOST:-}
      - DB_PORT=${DB_PORT:-5432}
      - DB_NAME=${DB_NAME:-}
      - DB_USER=${DB_USER:-}
      - DB_PASSWORD=${DB_PASSWORD:-}
      # MinIO trên NAS 25 — nơi lưu file ghi âm của khách hàng (endpoint dạng host:port, không có http://)
      - MINIO_ENDPOINT=${MINIO_ENDPOINT:-172.16.20.12:9100}
      - MINIO_ACCESS_KEY=${MINIO_ACCESS_KEY:-}
      - MINIO_SECRET_KEY=${MINIO_SECRET_KEY:-}
      - MINIO_BUCKET=${MINIO_BUCKET:-customer-records}
      # Bucket lưu file KẾT QUẢ convert (tự xóa theo lifecycle sau RESULT_RETENTION_DAYS)
      - MINIO_RESULT_BUCKET=${MINIO_RESULT_BUCKET:-converted-songs}
      # Bucket lưu MODEL đã train theo khách (giữ vĩnh viễn, train lại thì thay bản mới)
      - MINIO_MODEL_BUCKET=${MINIO_MODEL_BUCKET:-customer-models}
      # Model trên đĩa server chỉ là cache: quá N ngày không dùng thì xóa (0 = giữ vĩnh viễn)
      - MODEL_CACHE_DAYS=${MODEL_CACHE_DAYS:-1}
      # Tổng thời lượng file train tối đa mỗi lần gọi /train (phút, 0 = không giới hạn)
      - MAX_TRAIN_MINUTES=${MAX_TRAIN_MINUTES:-30}
      - MINIO_SECURE=${MINIO_SECURE:-0}
      # Bảng Postgres lưu thông tin bản ghi âm đã upload
      - RECORD_TABLE=${RECORD_TABLE:-rvc_recorded_files}
      # Domain công khai để build link stream/ảnh trong /api/shared/audio/paginate
      - PUBLIC_BASE_URL=${PUBLIC_BASE_URL:-https://idolvoice.karaokeicool.vn}
      # Webhook mặc định nhận kết quả task train/convert (callback_url theo request sẽ ghi đè)
      - TASK_CALLBACK_URL=${TASK_CALLBACK_URL:-https://crm.icool.com.vn/api/ai-voice/webhook}
      # Key gắn header X-API-Key khi gọi webhook (trống = dùng chung API_KEY)
      - TASK_CALLBACK_KEY=${TASK_CALLBACK_KEY:-}
      # Sau khi upload bản thu -> gọi CMS báo metadata (để trống = tắt)
      - CMS_METADATA_URL=${CMS_METADATA_URL:-https://cms-crm.icool.com.vn/api/files/recordings/metadata}
      # Bảng Postgres lưu danh sách bài đã convert (khách nghe thử rồi tải)
      - CONVERT_TABLE=${CONVERT_TABLE:-rvc_converted_songs}
      # Thời gian giữ file trong audios/: kết quả convert (*_COVER_*) và file trung gian
      - RESULT_RETENTION_DAYS=${RESULT_RETENTION_DAYS:-90}
      - RETENTION_DAYS=${RETENTION_DAYS:-10}
    # Cấp GPU cho container (cần nvidia-container-toolkit trên host)
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              device_ids: ["0"]   # ghim đúng RTX 5070 Ti
              capabilities: [gpu]
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/health"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 40s
    restart: unless-stopped
